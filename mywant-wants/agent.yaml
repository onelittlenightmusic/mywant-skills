agent:
  metadata:
    name: mywant_wants_agent
    capability: mywant_wants
    type: do
  script:
    path: ./main.py
    timeout_seconds: 30
  state_updates:
    - { name: ok,               type: bool,   label: current, persistent: true, onFetchData: "ok" }
    - { name: count,            type: number, label: current, persistent: true, onFetchData: "count" }
    - { name: execution_status, type: string, label: current, persistent: true, onFetchData: "execution_status" }
    - { name: status,           type: string, label: current, persistent: true, onFetchData: "status" }
    - { name: error,            type: string, label: current, persistent: true, onFetchData: "error" }
    - { name: summary,          type: string, label: current, persistent: true, onFetchData: "execution_status" }
